<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b81"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="50%" stop-color="#ff6b81"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#eaeaea" stroke-width="1" fill="none">
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
  </g>

  <!-- Decorative category icons (left side) -->
  <!-- Building icon (how_old) -->
  <g transform="translate(80, 160)" opacity="0.15">
    <rect x="0" y="20" width="60" height="80" rx="4" fill="none" stroke="#4ecdc4" stroke-width="3"/>
    <rect x="10" y="35" width="12" height="15" rx="2" fill="#4ecdc4"/>
    <rect x="38" y="35" width="12" height="15" rx="2" fill="#4ecdc4"/>
    <rect x="10" y="60" width="12" height="15" rx="2" fill="#4ecdc4"/>
    <rect x="38" y="60" width="12" height="15" rx="2" fill="#4ecdc4"/>
    <polygon points="30,0 65,20 -5,20" fill="none" stroke="#4ecdc4" stroke-width="3"/>
  </g>

  <!-- Stadium icon (how_many) -->
  <g transform="translate(80, 380)" opacity="0.15">
    <ellipse cx="30" cy="50" rx="35" ry="20" fill="none" stroke="#ffe66d" stroke-width="3"/>
    <path d="M -5 50 Q -5 20 30 20 Q 65 20 65 50" fill="none" stroke="#ffe66d" stroke-width="3"/>
    <line x1="0" y1="35" x2="0" y2="55" stroke="#ffe66d" stroke-width="3"/>
    <line x1="60" y1="35" x2="60" y2="55" stroke="#ffe66d" stroke-width="3"/>
  </g>

  <!-- Height icon (how_tall) -->
  <g transform="translate(1060, 160)" opacity="0.15">
    <rect x="15" y="10" width="30" height="90" rx="3" fill="none" stroke="#ff6b81" stroke-width="3"/>
    <line x1="30" y1="10" x2="30" y2="0" stroke="#ff6b81" stroke-width="3"/>
    <line x1="0" y1="100" x2="60" y2="100" stroke="#ff6b81" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="0" y1="10" x2="60" y2="10" stroke="#ff6b81" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="55" y1="15" x2="55" y2="95" stroke="#ff6b81" stroke-width="2"/>
    <polygon points="55,15 50,25 60,25" fill="#ff6b81"/>
    <polygon points="55,95 50,85 60,85" fill="#ff6b81"/>
  </g>

  <!-- Question marks scattered -->
  <text x="180" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="40" font-weight="800" fill="#e94560" opacity="0.1">?</text>
  <text x="1020" y="550" font-family="Segoe UI, system-ui, sans-serif" font-size="50" font-weight="800" fill="#e94560" opacity="0.1">?</text>
  <text x="950" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="35" font-weight="800" fill="#e94560" opacity="0.08">?</text>
  <text x="150" y="530" font-family="Segoe UI, system-ui, sans-serif" font-size="45" font-weight="800" fill="#e94560" opacity="0.08">?</text>

  <!-- Logo icon (centered, large) -->
  <g transform="translate(510, 130)">
    <rect x="0" y="0" width="180" height="180" rx="30" fill="none" stroke="url(#logo-grad)" stroke-width="8"/>
    <text x="90" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="120" font-weight="800" fill="url(#logo-grad)" text-anchor="middle">?</text>
  </g>

  <!-- Title -->
  <text x="600" y="390" font-family="Segoe UI, system-ui, sans-serif" font-size="72" font-weight="800" fill="#eaeaea" text-anchor="middle">Guesstimate</text>

  <!-- Subtitle -->
  <text x="600" y="445" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="400" fill="#a0a0b0" text-anchor="middle">Daily Guessing Game</text>

  <!-- Category pills -->
  <g transform="translate(310, 480)">
    <!-- How Old pill -->
    <rect x="0" y="0" width="150" height="40" rx="20" fill="#4ecdc4" opacity="0.15"/>
    <text x="75" y="26" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#4ecdc4" text-anchor="middle">How Old?</text>

    <!-- How Many pill -->
    <rect x="170" y="0" width="160" height="40" rx="20" fill="#ffe66d" opacity="0.15"/>
    <text x="250" y="26" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffe66d" text-anchor="middle">How Many?</text>

    <!-- How Tall pill -->
    <rect x="350" y="0" width="150" height="40" rx="20" fill="#ff6b81" opacity="0.15"/>
    <text x="425" y="26" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#ff6b81" text-anchor="middle">How Tall?</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent-grad)"/>
</svg>
